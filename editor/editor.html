:root {

  --fg: #1d1b1a; --muted: #8a827c; --brown: #b8956f; --brownsoft: #efe3d6; --mint: #bfe8e3; --red: #c0392b; --green: #1f8f7c;
  --display: Inter, system-ui, sans-serif;
  --head: "Instrument Serif", Georgia, serif;
  --serif: "Playfair Display", Georgia, serif;
  --mono: Inter, system-ui, sans-serif;
  color-scheme: light;
}
button { touch-action: manipulation; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; }

input[type="text"], textarea { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; color: var(--fg); padding: 8px 10px; font: 600 15px var(--display); }
textarea { min-height: 100px; font-weight: 400; }

input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--brown); }
input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #d8cfc7; box-shadow: 0 1px 5px rgba(0,0,0,.28); }

.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.chip .ic { display: block; }
.transport .chip .tl { display: none; }
.tbar2 { display: flex; align-items: center; gap: 6px; padding: 6px 14px 0; }

.tscroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
.inner { position: relative; display: flex; flex-direction: column; gap: 4px; }

.transport, .tbar2, .lenbar { background: var(--panel2); }

.rscroll::-webkit-scrollbar { display: none; }

.rph::before { content: ""; position: absolute; bottom: 0; left: -5px; width: 12px; height: 12px; background: var(--fg); border-radius: 2px 2px 7px 7px; }

.vrow { display: flex; gap: 0; height: 58px; }  /* no gap: a gap would push every clip right of where the playhead and the cut are */
.clip { position: relative; flex: none; height: 58px; overflow: hidden; border-radius: 4px; background: #000; cursor: pointer; outline: 2px solid transparent; outline-offset: -2px; }
.clip::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--panel); pointer-events: none; z-index: 1; }
.clip.sel { outline-color: var(--brown); z-index: 2; }

.clip.muted .cname { color: var(--red); }
.handle { position: absolute; top: 0; bottom: 0; width: 16px; background: var(--brown); touch-action: none; cursor: ew-resize; display: none; align-items: center; justify-content: center; color: var(--fg); font: 700 13px var(--display); }
.clip.sel .handle { display: flex; }
.handle.l { left: 0; }

.ph { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--fg); z-index: 5; pointer-events: none; will-change: transform; }

.track { position: relative; height: 28px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.blk { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; font: 600 10px var(--display); color: #15131a; padding: 0 4px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; background: #dedcf6; }
.blk.title { background: #fbd36b; }
.blk.zoom { background: #9cc9ff; }
.blk.zm { background: #f2b8a8; cursor: grab; touch-action: none; font-weight: 800; }   /* manual zoom points (user 2026-11-10: zoom she can add, move, delete) */
.blk.zm.sel { outline: 2px solid var(--fg); outline-offset: -2px; }
.blk.sfx { background: var(--mint); cursor: grab; touch-action: none; }
.blk.sfx.sel, .blk.part.sel, .blk.stb.sel { outline: 2px solid var(--fg); outline-offset: -2px; touch-action: none; cursor: grab; }
.blk.voice { background: var(--mint); }
.blk.part { cursor: pointer; padding: 0 20px; }
.blk.stb { background: var(--brownsoft); cursor: pointer; }

.blk.fixed { background: #6d6779; color: var(--fg); }
.vh { position: absolute; top: 0; bottom: 0; width: 18px; background: var(--brown); color: var(--fg); display: flex; align-items: center; justify-content: center; font: 700 12px var(--mono); touch-action: none; cursor: ew-resize; }
.vh.l { left: 0; } .vh.r { right: 0; }
.boot { padding: 30px; text-align: center; color: var(--muted); }

/* Desktop / web (2026-11-10): preview sticks at the top, the button bars, ruler and timeline stick at the bottom (bottom offsets from stickTops), so editing never hides the preview. Phone keeps its own sticky layout below. */
@media (min-width: 681px) {
  .app { overflow: clip; }
  .stagecol { position: sticky; top: 8px; align-self: start; z-index: 6; }
  .stage { align-self: center; width: auto; max-width: 100%; height: max(220px, min(480px, calc(100vh - var(--botH, 300px) - 28px))); }
  #main .transport, #main .tbar2, #main .lenbar, #main .rbar, #main .ed { position: sticky; z-index: 9; }
  #main .ed { background: var(--panel); }
}
@media (max-width: 680px) {
  body { padding-left: 0; padding-right: 0; padding-block: 0 40px; }
  .app { border: 0; border-radius: 0; overflow: visible; }
  #main { display: flex; flex-direction: column; }
  .body { display: contents; }
  .stripe { display: none; }
  .tabs { order: 0; position: sticky; top: 0; z-index: 21; margin: 0; border-radius: 0; height: 40px; }
  .tab { padding: 5px 10px; }
  .stagecol { order: 1; position: sticky; top: 40px; z-index: 20; background: var(--panel); padding: 6px 0; border-bottom: 1px solid var(--line); }
  .stage { height: 40vh; width: calc(40vh * 9 / 16); max-width: 100%; margin: 0 auto; }
  .stagecol > .chip, .stagecol > .legend { display: none; }
  .sidectl { display: flex; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); flex-direction: column; gap: 14px; z-index: 2; }
  .sidectl .chip { width: 52px; height: 52px; padding: 0; border-radius: 50%; justify-content: center; }
  .sidectl .chip .tl { display: none; }
  .sidectl .chip .ic { width: 22px; height: 22px; }
  .transport { order: 2; border-top: 0; padding: 8px 10px 0; gap: 4px; justify-content: space-between; }
  .transport .chip { padding: 7px; flex: none; }
  .tc { order: 9; font-size: 11px; }
  .transport label { order: 10; margin-left: auto; }
  .transport input[type="range"] { width: 110px; }
  .tbar2 { order: 2; padding: 4px 10px 0; gap: 4px; }
  .tbar2 .chip { padding: 7px 12px; }
  .tbar2 input[type="range"] { width: 110px; }
  .lenbar { order: 3; padding: 4px 10px 0; font-size: 12px; }
  .rbar { order: 3; padding: 4px 10px 0; }
  #main.stick .transport { position: sticky; top: var(--tTop, 0px); z-index: 19; background: var(--panel2); padding-bottom: 4px; }
  #main.stick .rbar { position: sticky; top: var(--rTop, 0px); z-index: 19; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  #main.capt .rbar { order: 4; }
  .ed { order: 4; padding: 6px 10px 10px; }
  .ed { order: 4; padding: 6px 10px 10px; }
  .controls { order: 5; padding: 12px 12px 0; }
  #main.capt .controls { order: 2; padding-bottom: 12px; }
  #main.capt .transport { order: 3; border-top: 1px solid var(--line); }
  #main.capt .lenbar { order: 4; }
  #main.capt .ed { order: 5; }
  .words { max-height: 220px; }
}

/* ===== 2026-11-12 glass UI. Colours unchanged (cream, brown, mint, butter, lilac); surfaces turn into frosted glass.
   Blur only on the small bars that float over moving content, so scrolling and playback stay smooth. ===== */
:root { --glass: rgba(255,255,255,.62); --glass2: rgba(255,255,255,.42); --gline: rgba(255,255,255,.85); --gsh: 0 8px 28px rgba(110,84,58,.12); --gblur: saturate(1.6) blur(16px); }
body { background:
  radial-gradient(60vmax 60vmax at 6% 0%, #efe3d6 0%, rgba(239,227,214,0) 62%),
  radial-gradient(52vmax 52vmax at 100% 10%, rgba(191,232,227,.75) 0%, rgba(191,232,227,0) 62%),
  radial-gradient(56vmax 56vmax at 88% 100%, rgba(207,202,243,.6) 0%, rgba(207,202,243,0) 60%),
  radial-gradient(50vmax 50vmax at 0% 92%, rgba(251,211,107,.38) 0%, rgba(251,211,107,0) 60%), var(--bg);
  background-attachment: fixed; }
.app { background: var(--glass2); border: 1px solid var(--gline); border-radius: 22px; box-shadow: var(--gsh); }
.top { position: sticky; top: 0; z-index: 30; flex-wrap: nowrap; background: var(--glass); -webkit-backdrop-filter: var(--gblur); backdrop-filter: var(--gblur); border-bottom: 1px solid var(--gline); border-radius: 22px 22px 0 0; padding: 8px 14px; }
.top h1 { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 24px; }
.top .saved { flex: 0 1 auto; min-width: 0; max-width: 42%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.stripe { padding: 6px 14px 4px; }
.parts { display: flex; align-items: center; gap: 4px; flex: none; }
.parts .plab { font: 600 11px var(--display); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.pbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--gline); background: rgba(255,255,255,.7); color: var(--fg); font: 700 14px var(--display); cursor: pointer; text-decoration: none; box-shadow: 0 1px 4px rgba(110,84,58,.12); }
.pbtn[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: var(--fg); }
.tabs { background: rgba(243,238,234,.72); border: 1px solid var(--gline); -webkit-backdrop-filter: var(--gblur); backdrop-filter: var(--gblur); box-shadow: 0 2px 10px rgba(110,84,58,.08); }

.lib button, .phgrid button { background: rgba(255,255,255,.55); border-color: var(--gline); }
input[type="text"], textarea { background: rgba(255,255,255,.75); border-color: var(--gline); box-shadow: inset 0 1px 3px rgba(110,84,58,.08); }

.transport, .tbar2, .lenbar, .rbar { background: rgba(243,238,234,.78); -webkit-backdrop-filter: var(--gblur); backdrop-filter: var(--gblur); }

.fold { background: rgba(255,255,255,.45); border: 1px solid var(--gline); border-radius: 14px; padding: 8px 10px; }

.zrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }

.hook.tp-right { left: auto; right: 11.11%; text-align: right; align-items: flex-end; }
.cap span[data-i] { margin: 0 calc(1cqw * var(--ck) * var(--cg, 1)); }

.legend.keys { display: none; }
#siProbe { position: fixed; left: 0; top: 0; width: 0; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.top { top: env(safe-area-inset-top, 0px); }
.rbar > span { display: flex; flex-direction: column; gap: 4px; padding-top: 26px; }
.rbar .rlab { height: 28px; margin-top: 0; }
.rbar .rlab.lv { height: 58px; }
.rinner .vrow.fxsticky { background: none; }
.catbar { display: flex; gap: 5px; overflow-x: auto; padding: 4px; margin: 0 -2px; border-radius: 999px; background: rgba(243,238,234,.8); border: 1px solid var(--gline); scrollbar-width: none; position: sticky; top: calc(var(--topH, 0px) + 6px); z-index: 5; -webkit-backdrop-filter: var(--gblur); backdrop-filter: var(--gblur); }

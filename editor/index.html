<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Editor">
<link rel="apple-touch-icon" href="../icons/editor-180.png">
<link rel="stylesheet" href="../css/app.css">
<meta name="theme-color" content="#0c0c13">
<style>body.boot{margin:0;background:#101014;color:#eee;font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px}body.boot a{color:#58c7d6}
body.list{margin:0;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px;min-height:100vh}
.el h1{font-size:26px;margin:0 0 4px}.el .row{display:flex;align-items:center;gap:10px;padding:14px;margin-top:10px;border-radius:18px;text-decoration:none;color:inherit}
.el .row b{display:block;font-size:16px}.el .row span{flex:1;min-width:0}.el .row i{font-style:normal;font-size:20px}</style>
</head>
<body class="boot">
<p id="m">Membuka editor…</p>
<script>
/* Pintu masuk editor: editor/?v=<id>. Pastikan service worker Studio aktif, kemudian pergi ke editor/v/<id>/ (dihidang oleh sw.js). */
(async () => {
  const v = new URLSearchParams(location.search).get('v'), m = document.getElementById('m');
  /* 24 Nov 2026 (Mira): Editor boleh jadi app sendiri di Home Screen (manifest editor/, start_url ?app=1), berasingan dari Studio
     supaya boleh tukar antara Studio dan Editor dalam app switcher. Tanpa ?v= : senarai projek dari Studio (doc edpwa). */
  if (new URLSearchParams(location.search).get('app')) try { localStorage.setItem('edApp', '1'); } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}   // Fasa 1B: jangan biar phone buang storan editor
  if (!v) return edList(m);
  if (!('serviceWorker' in navigator)) { m.textContent = 'Browser ni tak sokong editor Studio.'; return; }
  const reg = await navigator.serviceWorker.register('../sw.js', { scope: '../' });
  reg.update().catch(() => {});
  // tunggu service worker versi baru (yang kenal laluan editor) mengawal page ni
  const ping = () => new Promise(res => { const c = navigator.serviceWorker.controller; if (!c) return res(false);
    const ch = new MessageChannel(); const t = setTimeout(() => res(false), 700); ch.port1.onmessage = e => { clearTimeout(t); res(e.data === 'ed1'); }; c.postMessage({ t: 'edping' }, [ch.port2]); });
  for (let i = 0; i < 40; i++) { if (await ping()) return location.replace('v/' + encodeURIComponent(v) + '/'); if (i === 8) m.textContent = 'Menyediakan editor kali pertama…'; await new Promise(r => setTimeout(r, 500)); }
  m.innerHTML = 'Editor belum sedia. Tutup app Studio sepenuhnya, buka semula, kemudian cuba lagi. <a href="">Cuba lagi</a>';
})().catch(e => { document.getElementById('m').textContent = 'Editor tak dapat dibuka: ' + e.message; });

async function edList(m) {
  /* 25 Nov 2026 (Mira): senarai + New Video duduk DALAM APP EDITOR ni (bukan tab Studio). Kod: ed-list.js, gaya: ../css/editor-list.css */
  m.textContent = 'Memuatkan video…';
  const bust = '?v=' + Date.now();
  const load = src => new Promise((res, rej) => { const t = document.createElement('script'); t.src = src + bust; t.onload = res; t.onerror = rej; document.head.appendChild(t); });
  await new Promise(res => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '../css/editor-list.css' + bust; l.onload = l.onerror = res; document.head.appendChild(l); });
  await load('../js/config.js'); await load('../js/runtime.js'); await load('ed-list.js');
  document.body.className = 'list'; m.remove();
  const box = document.createElement('div'); box.className = 'elroot'; document.body.appendChild(box);
  await EdList.start(box);
}
</script>
</body>
</html>
